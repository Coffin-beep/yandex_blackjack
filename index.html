<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Блэкджек — Казино</title>
  <!-- Yandex Games SDK v2 (в dev-режиме вне Яндекса недоступен — игра плавно переключится на мок) -->
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%82%A1%3C/text%3E%3C/svg%3E" />
  <style>
    /* Прелоадер показывается до инициализации бандла */
    html, body { margin: 0; padding: 0; height: 100%; background: #07271d; }
    #boot-loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #e9c46a; font-family: Georgia, 'Times New Roman', serif; font-size: 22px;
      letter-spacing: 2px; z-index: 999;
    }
  </style>
</head>
<body>
  <div id="app" role="application" aria-label="Блэкджек">
    <div id="boot-loader">Загрузка стола…</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
